# ============================================================
#  BiteWise - configurare aplicatie
# ============================================================

spring.application.name=BiteWise

# --- SECURITATE RETEA ---------------------------------------
# Serverul asculta DOAR pe interfata loopback (127.0.0.1).
# Astfel aplicatia este accesibila EXCLUSIV de pe acest laptop;
# nimeni din reteaua caminului nu poate ajunge la ea.
server.address=127.0.0.1
server.port=8080

# --- BAZA DE DATE (H2 in-memory) ----------------------------
# Datele se sterg la fiecare repornire (zero configurare).
spring.datasource.url=jdbc:h2:mem:bitewise;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Consola H2 ---------------------------------------------
# Activata doar local (nu este expusa in retea pentru ca tot
# serverul asculta numai pe 127.0.0.1). Optional pentru debug.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Jackson ------------------------------------------------
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
